
spring.application.name=FocusStudio-Cristel
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/focus_studio?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false

focus.admin.user=${ADMIN_USER:admin}
focus.admin.password=${ADMIN_PASSWORD:}

server.port=8081
