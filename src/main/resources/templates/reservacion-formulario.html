<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reservar sesión | Focus Studio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">

        <div class="text-center mb-4">
            <h1 class="fw-bold">Reservar sesión fotográfica</h1>
            <p class="text-muted">
                Revisá los detalles de tu sesión y completá
                la información para solicitar tu reservación.
            </p>
        </div>

        <div class="card shadow-sm border-0 mx-auto"
             style="max-width: 650px;">

            <div class="card-body p-4">

                <form th:action="@{/reservaciones/guardar}"
                      method="post">

                    <input type="hidden"
                           name="servicioId"
                           th:value="${servicio.id}">

                    <input type="hidden"
                           name="fecha"
                           th:value="${fecha}">

                    <input type="hidden"
                           name="hora"
                           th:value="${hora}">

                    <h5 class="mb-4">Detalles de la sesión</h5>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Servicio seleccionado
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${servicio.nombre}"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Fecha
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${fecha}"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Hora
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${hora}"
                               readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">
                            Duración
                        </label>

                        <input type="text"
                               class="form-control"
                               th:value="${servicio.duracionMinutos + ' minutos'}"
                               readonly>
                    </div>

                    <div class="mb-4">
                        <label for="ubicacion"
                               class="form-label fw-semibold">
                            Ubicación de la sesión *
                        </label>

                        <input type="text"
                               id="ubicacion"
                               name="ubicacion"
                               class="form-control"
                               maxlength="255"
                               placeholder="Ej. Parque La Sabana, San José"
                               required>

                        <div class="form-text">
                            Indicá dónde querés realizar tu sesión.
                        </div>
                    </div>

                    <div th:if="${error}"
                         class="alert alert-danger"
                         th:text="${error}">
                    </div>

                    <button type="submit"
                            class="btn btn-dark w-100">
                        Confirmar reservación
                    </button>

                    <a th:href="@{/disponibilidad}"
                       class="btn btn-outline-secondary w-100 mt-2">
                        Volver a disponibilidad
                    </a>

                </form>

            </div>
        </div>

    </div>

</body>
</html>
