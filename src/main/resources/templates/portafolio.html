<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Portafolio | Focus Studio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra de navegación -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">
                📸 Focus Studio
            </a>

            <a class="btn btn-outline-light"
               th:href="@{/}">
                Inicio
            </a>
        </div>
    </nav>

    <!-- Encabezado -->
    <section class="container text-center py-5">
        <h1 class="fw-bold">Nuestro portafolio</h1>

        <p class="text-muted">
            Descubrí algunos de los momentos especiales
            que hemos capturado.
        </p>
    </section>

    <!-- Galería de fotografías -->
    <main class="container pb-5">
        
           <!-- Mostrar todas las fotografías -->
        <a th:href="@{/portafolio}"
           class="btn"
           th:classappend="${categoriaSeleccionada == null}
                ? 'btn-dark' : 'btn-outline-dark'">
            Todas
        </a>

        <!-- Mostrar fotografías de una categoría -->
        <a th:each="categoria : ${categorias}"
           th:href="@{/portafolio(categoriaId=${categoria.id})}"
           th:text="${categoria.nombre}"
           class="btn"
           th:classappend="${categoriaSeleccionada == categoria.id}
                ? 'btn-dark' : 'btn-outline-dark'">
            Categoría
        </a>

    </div>
</div>

        <!-- Mensaje cuando no hay fotografías -->
        <div class="alert alert-info text-center"
             th:if="${#lists.isEmpty(fotografias)}">
            Todavía no hay fotografías disponibles
            en nuestro portafolio.
        </div>

        <!-- Fotografías disponibles -->
        <div class="row g-4"
             th:unless="${#lists.isEmpty(fotografias)}">

            <div class="col-md-6 col-lg-4"
                 th:each="foto : ${fotografias}">

                <div class="card h-100 shadow-sm">

                    <img th:src="${foto.urlImagen}"
                         th:alt="${foto.titulo}"
                         class="card-img-top"
                         style="height: 250px; object-fit: cover;">

                    <div class="card-body">

                        <h5 class="card-title"
                            th:text="${foto.titulo}">
                            Título de fotografía
                        </h5>

                        <p class="card-text text-muted"
                           th:text="${foto.descripcion}">
                            Descripción de fotografía
                        </p>

                    </div>
                </div>

            </div>
        </div>

    </main>

    <!-- Pie de página -->
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">
            © 2026 Focus Studio
        </p>
    </footer>

</body>
</html>
