<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | Focus Studio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#faf7f4} .navbar{background:#3c3334!important} .card{border:1px solid #eadfdb} .btn-primary{background:#75585a;border-color:#75585a}</style></head><body><nav class="navbar navbar-dark p-3"><div class="container"><a class="navbar-brand" href="/">📸 Focus Studio</a><div><a class="btn btn-outline-light btn-sm me-2" href="/registro">Registro</a><a class="btn btn-outline-light btn-sm" href="/admin">Administración</a></div></div></nav><main class="container py-5"><h1>HU-07 · Registro de usuarios</h1><div th:if="${param.ok}" class="alert alert-success">Cuenta registrada correctamente.</div><div th:if="${error}" class="alert alert-danger" th:text="${error}"></div><form th:action="@{/registro}" th:object="${form}" method="post" class="card p-4" style="max-width:600px"><label>Nombre<input class="form-control" th:field="*{nombre}" required maxlength="120"></label><div class="text-danger" th:errors="*{nombre}"></div><label class="mt-3">Correo<input class="form-control" type="email" th:field="*{correo}" required></label><div class="text-danger" th:errors="*{correo}"></div><label class="mt-3">Contraseña (mínimo 8 caracteres)<input class="form-control" type="password" th:field="*{password}" minlength="8" required></label><div class="text-danger" th:errors="*{password}"></div><button class="btn btn-primary mt-4">Registrarme</button></form></main></body></html>
