<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Disponibilidad | Focus Studio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container py-5">
        
<div th:if="${error}"
     class="alert alert-danger text-center"
     th:text="${error}">
</div>

        <div class="text-center mb-5">
            <h1 class="fw-bold">Consulta de disponibilidad</h1>
            <p class="text-muted">
                Seleccioná tu servicio y una fecha para conocer
                nuestros horarios disponibles.
            </p>
        </div>

        <div class="card shadow-sm border-0 mx-auto"
             style="max-width: 650px;">

            <div class="card-body p-4">

                <div class="mb-4">
                    <label for="servicio" class="form-label fw-semibold">
                        Servicio fotográfico
                    </label>

                    <select id="servicio" class="form-select">
                        <option value="">Seleccioná un servicio</option>

                        <option th:each="servicio : ${servicios}"
                                th:value="${servicio.id}"
                                th:text="${servicio.nombre + ' - ' + servicio.duracionMinutos + ' minutos'}">
                        </option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="fecha" class="form-label fw-semibold">
                        Fecha de la sesión
                    </label>

                    <input type="date"
                           id="fecha"
                           class="form-control">
                </div>

                <button type="button"
                        class="btn btn-dark w-100"
                        onclick="consultarDisponibilidad()">
                    Consultar horarios
                </button>

                <div id="resultado" class="mt-4"
                     aria-live="polite"></div>

            </div>
        </div>

    </div>

    <script>
        const fechaInput = document.getElementById("fecha");
        const resultado = document.getElementById("resultado");

        // Evita seleccionar fechas anteriores a hoy.
        function fechaLocalHoy() {
            const hoy = new Date();
            const anio = hoy.getFullYear();
            const mes = String(hoy.getMonth() + 1).padStart(2, "0");
            const dia = String(hoy.getDate()).padStart(2, "0");

            return `${anio}-${mes}-${dia}`;
        }

        fechaInput.min = fechaLocalHoy();

        async function consultarDisponibilidad() {

            const servicioId =
                    document.getElementById("servicio").value;

            const fecha = fechaInput.value;

            resultado.innerHTML = "";

            if (!servicioId || !fecha) {
                resultado.textContent =
                        "Por favor, seleccioná un servicio y una fecha.";
                return;
            }

            resultado.textContent = "Consultando horarios...";

            try {
                const parametros = new URLSearchParams({
                    servicioId: servicioId,
                    fecha: fecha
                });

                const respuesta = await fetch(
                        `/disponibilidad/horarios?${parametros}`
                );

                if (!respuesta.ok) {
                    throw new Error("No se pudieron consultar los horarios.");
                }

                const horarios = await respuesta.json();

                resultado.innerHTML = "";

                const titulo = document.createElement("h5");
                titulo.textContent = "Horarios disponibles";
                resultado.appendChild(titulo);

                if (horarios.length === 0) {
                    const mensaje = document.createElement("p");
                    mensaje.className = "text-muted";
                    mensaje.textContent =
                            "No hay horarios disponibles para esta fecha.";
                    resultado.appendChild(mensaje);
                    return;
                }

                const contenedor = document.createElement("div");
                contenedor.className = "d-flex flex-wrap gap-2 mt-3";

                horarios.forEach(hora => {
                    const boton = document.createElement("button");

                    boton.type = "button";
                    boton.className = "btn btn-outline-success";
                    boton.textContent = hora.substring(0, 5);

                    // HU-05 utilizará estos horarios para reservar.
boton.addEventListener("click", () => {

    const parametrosReserva = new URLSearchParams({
        servicioId: servicioId,
        fecha: fecha,
        hora: hora.substring(0, 5)
    });

    window.location.href =
            `/reservaciones/nueva?${parametrosReserva}`;
});

                    contenedor.appendChild(boton);
                });

                resultado.appendChild(contenedor);

            } catch (error) {
                resultado.textContent =
                        "Ocurrió un error al consultar la disponibilidad.";
                console.error(error);
            }
        }

        // Limpia resultados anteriores cuando cambia la búsqueda.
        document.getElementById("servicio")
                .addEventListener("change", () => {
                    resultado.innerHTML = "";
                });

        fechaInput.addEventListener("change", () => {
            resultado.innerHTML = "";
        });
    </script>

</body>
</html>
