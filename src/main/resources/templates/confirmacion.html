<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirmación | Focus Studio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#faf7f4} .navbar{background:#3c3334!important} .card{border:1px solid #eadfdb} .btn-primary{background:#75585a;border-color:#75585a}</style></head><body><nav class="navbar navbar-dark p-3"><div class="container"><a class="navbar-brand" href="/">📸 Focus Studio</a><div><a class="btn btn-outline-light btn-sm me-2" href="/registro">Registro</a><a class="btn btn-outline-light btn-sm" href="/admin">Administración</a></div></div></nav><main class="container py-5"><h1>HU-06 · Confirmación de reservación</h1><div class="alert alert-success">Reservación registrada correctamente.</div><div class="card p-4"><p><b>Código:</b> <span th:text="${reserva.codigo}"></span></p><p><b>Cliente:</b> <span th:text="${reserva.cliente}"></span></p><p><b>Servicio:</b> <span th:text="${reserva.servicio}"></span></p><p><b>Fecha y hora:</b> <span th:text="${#temporals.format(reserva.fechaHora,'dd/MM/yyyy HH:mm')}"></span></p><p><b>Ubicación:</b> <span th:text="${reserva.ubicacion}"></span></p><p><b>Estado:</b> <span th:text="${reserva.estado}"></span></p></div></main></body></html>
