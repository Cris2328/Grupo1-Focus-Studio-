<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Categorías | Focus Studio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#faf7f4} .navbar{background:#3c3334!important} .card{border:1px solid #eadfdb} .btn-primary{background:#75585a;border-color:#75585a}</style></head><body><nav class="navbar navbar-dark p-3"><div class="container"><a class="navbar-brand" href="/">📸 Focus Studio</a><div><a class="btn btn-outline-light btn-sm me-2" href="/registro">Registro</a><a class="btn btn-outline-light btn-sm" href="/admin">Administración</a></div></div></nav><main class="container py-5"><h1>HU-10 · Gestión de categorías</h1><a class="btn btn-primary mb-3" href="/admin/categorias/nueva">Nueva categoría</a><table class="table table-striped"><thead><tr><th>Nombre</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr></thead><tbody><tr th:each="c : ${categorias}"><td th:text="${c.nombre}"></td><td th:text="${c.descripcion}"></td><td th:text="${c.activa ? 'Activa' : 'Inactiva'}"></td><td><a class="btn btn-sm btn-outline-primary" th:href="@{/admin/categorias/{id}/editar(id=${c.id})}">Editar</a><form class="d-inline" th:action="@{/admin/categorias/{id}/estado(id=${c.id})}" method="post"><input type="hidden" name="activa" th:value="${!c.activa}"><button class="btn btn-sm btn-outline-secondary" th:text="${c.activa ? 'Desactivar' : 'Activar'}"></button></form></td></tr></tbody></table></main></body></html>
