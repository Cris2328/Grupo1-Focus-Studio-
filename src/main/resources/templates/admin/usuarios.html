<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Usuarios | Focus Studio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#faf7f4} .navbar{background:#3c3334!important} .card{border:1px solid #eadfdb} .btn-primary{background:#75585a;border-color:#75585a}</style></head><body><nav class="navbar navbar-dark p-3"><div class="container"><a class="navbar-brand" href="/">📸 Focus Studio</a><div><a class="btn btn-outline-light btn-sm me-2" href="/registro">Registro</a><a class="btn btn-outline-light btn-sm" href="/admin">Administración</a></div></div></nav><main class="container py-5"><h1>HU-08 · Gestión de cuentas</h1><table class="table table-striped"><thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th>Acción</th></tr></thead><tbody><tr th:each="u : ${usuarios}"><td th:text="${u.nombre}"></td><td th:text="${u.correo}"></td><td th:text="${u.activo ? 'Activo' : 'Inactivo'}"></td><td><form th:action="@{/admin/usuarios/{id}/estado(id=${u.id})}" method="post"><input type="hidden" name="activo" th:value="${!u.activo}"><button class="btn btn-sm btn-outline-secondary" th:text="${u.activo ? 'Desactivar' : 'Activar'}"></button></form></td></tr></tbody></table></main></body></html>
