<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formulario categoría | Focus Studio</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#faf7f4} .navbar{background:#3c3334!important} .card{border:1px solid #eadfdb} .btn-primary{background:#75585a;border-color:#75585a}</style></head><body><nav class="navbar navbar-dark p-3"><div class="container"><a class="navbar-brand" href="/">📸 Focus Studio</a><div><a class="btn btn-outline-light btn-sm me-2" href="/registro">Registro</a><a class="btn btn-outline-light btn-sm" href="/admin">Administración</a></div></div></nav><main class="container py-5"><h1>HU-10 · Formulario de categoría</h1><form class="card p-4" style="max-width:600px" th:action="@{/admin/categorias/guardar}" th:object="${form}" method="post"><input type="hidden" name="id" th:value="${id}"><label>Nombre<input class="form-control" th:field="*{nombre}" maxlength="100" required></label><div class="text-danger" th:errors="*{nombre}"></div><label class="mt-3">Descripción<textarea class="form-control" th:field="*{descripcion}" maxlength="600" required></textarea></label><div class="text-danger" th:errors="*{descripcion}"></div><button class="btn btn-primary mt-3">Guardar</button></form></main></body></html>
